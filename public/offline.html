<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366F1" />
    <title>You're offline — Tutorly</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0F172A; background: #F8FAFC; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #E2E8F0; border-radius: 20px; background: #fff; box-shadow: 0 12px 32px rgb(15 23 42 / 8%); text-align: center; }
      .mark { width: 48px; height: 46px; margin: 0 auto 20px; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.6; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; color: #fff; background: #6366F1; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #A5B4FC; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/favicon.svg" alt="Tutorly" />
      <h1>You're offline</h1>
      <p>A network connection is required to sign in and access current school information. Attendance and payments are not saved while offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
